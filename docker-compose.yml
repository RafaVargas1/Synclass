services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synclass}
      POSTGRES_USER: ${POSTGRES_USER:-synclass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synclass}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - synclass_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-synclass}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-synclass};Username=${POSTGRES_USER:-synclass};Password=${POSTGRES_PASSWORD:-synclass}"
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  synclass_postgres_data:
