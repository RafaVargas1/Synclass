services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synclass}
      POSTGRES_USER: ${POSTGRES_USER:-synclass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synclass}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - synclass_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-synclass}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Simula o build de produção: mesma imagem (dotnet publish -c Release) que
  # rodaria em produção, em ASPNETCORE_ENVIRONMENT=Production. Para
  # desenvolvimento com hot reload, rode a API via `dotnet watch run` local
  # (ver backend/README.md) — os dois podem ficar de pé ao mesmo tempo.
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-synclass};Username=${POSTGRES_USER:-synclass};Password=${POSTGRES_PASSWORD:-synclass}"
      # Sem isso, o navegador bloqueia o fetch do frontend web (Expo, porta
      # 8081) por CORS — appsettings.json (Production) não libera nenhuma
      # origem por padrão, então essa liberação é só para uso local/QA deste
      # container, não para um deploy real futuro (ver appsettings.json).
      Cors__AllowedOrigins__0: "http://localhost:8081"
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  synclass_postgres_data:
